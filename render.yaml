services:
  - type: web
    name: doctor-appointment
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn doctor_appointment.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: doctor-appointment-db
          property: connectionString

databases:
  - name: doctor-appointment-db
    databaseName: doctor_appointment
    user: doctor_appointment
    plan: free
